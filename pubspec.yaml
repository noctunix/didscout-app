name: didscout_app
description: "Android companion to didscout: read-only vehicle recording over a BLE OBD adapter"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  obdbridge:
    git:
      url: https://github.com/noctunix/obdbridge.git
      ref: v0.2.1
  battery_plus: ^7.1.2
  path_provider: ^2.1.0
  permission_handler: ^13.0.2
  share_plus: ^13.3.1
  shared_preferences: ^2.3.0
  uuid: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
