[project]
name = "didscout-logs"
version = "0.1.0"
description = "Offline analysis of didscout-app recording logs"
readme = "README.md"
authors = [
    { name = "Noctunix", email = "coder@noctunix.de" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.2",
]

[project.scripts]
didscout-logs = "didscout_logs.cli:main"

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "S", "SIM", "C4", "PIE", "PTH", "RUF", "PT", "ASYNC",
    "D", "ANN401", "BLE", "ARG", "ERA", "T20", "RET",
]
ignore = ["D100", "D104", "D105", "D107"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 72

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
warn_unreachable = true
plugins = ["pydantic.mypy"]
enable_error_code = [
    "ignore-without-code", "redundant-expr", "truthy-bool", "possibly-undefined",
    "explicit-override", "mutable-override", "unused-awaitable", "redundant-self",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
